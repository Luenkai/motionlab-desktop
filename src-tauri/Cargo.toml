[package]
name = "motionlab"
version = "0.1.0"
description = "Offline Live2D movement testing workspace"
authors = ["motionlab"]
edition = "2021"

[lib]
name = "motionlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
